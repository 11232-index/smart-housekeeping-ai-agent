<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能家政 Agent 控制台</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #111a2e;
    --panel-2: #16213a;
    --text: #e8eefc;
    --muted: #8ea0c0;
    --border: #243250;
    --accent: #4fd1c5;
    --accent-2: #6ea8fe;
    --user: #1d4ed8;
    --danger: #f87171;
    --ok: #34d399;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(circle at 10% 0%, #15233e 0, var(--bg) 42%);
    color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  .app { height: 100vh; display: flex; flex-direction: column; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(11, 18, 32, 0.82);
    backdrop-filter: blur(12px);
  }
  .brand { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; white-space: nowrap; }
  .brand span { color: var(--accent); font-weight: 500; font-size: 13px; margin-left: 6px; }
  .token-area { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .user-label {
    font-size: 12px; color: var(--muted); background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 999px; padding: 5px 10px;
    max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .token-area input {
    width: 210px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    outline: none; font-size: 12px;
  }
  .token-area input:focus { border-color: var(--accent-2); }

  main {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: minmax(0, 1fr) 340px;
    gap: 14px; padding: 14px 18px 18px;
  }

  .chat-panel {
    min-height: 0; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.24);
  }
  .messages {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .messages::-webkit-scrollbar, .side-panel::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb, .side-panel::-webkit-scrollbar-thumb {
    background: #2a3a5c; border-radius: 8px;
  }
  .message { display: flex; gap: 10px; max-width: 86%; animation: rise 0.18s ease-out; }
  .message.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar {
    flex: 0 0 34px; width: 34px; height: 34px; border-radius: 10px;
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
    background: var(--panel-2); color: var(--accent); border: 1px solid var(--border);
  }
  .message.user .avatar { color: #fff; background: var(--user); border-color: transparent; }
  .bubble {
    padding: 12px 14px; border-radius: 14px; line-height: 1.65;
    background: var(--panel-2); border: 1px solid var(--border);
    white-space: pre-wrap; word-break: break-word; font-size: 14px;
  }
  .message.user .bubble { background: var(--user); border-color: transparent; color: #fff; }
  .bubble.error { border-color: rgba(248, 113, 113, 0.6); color: #fecaca; }
  .bubble.streaming::after {
    content: "▌"; color: var(--accent); margin-left: 2px;
    animation: blink 0.9s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .composer {
    display: flex; gap: 10px; padding: 12px 14px;
    border-top: 1px solid var(--border); background: rgba(17, 26, 46, 0.8);
  }
  .composer textarea {
    flex: 1; resize: none; height: 54px; padding: 10px 12px;
    border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); outline: none;
    font-size: 14px; line-height: 1.4;
  }
  .composer textarea:focus { border-color: var(--accent-2); }
  .send-btn {
    width: 86px; border: 0; border-radius: 10px; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #06111f; font-weight: 800; font-size: 14px;
  }
  .send-btn:disabled { opacity: 0.55; cursor: not-allowed; }

  .side-panel { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px;
  }
  .card h3 { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: 0.4px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 0; font-size: 13px; }
  .row span { color: var(--muted); }
  .row b { color: var(--text); font-weight: 600; text-align: right; word-break: break-all; }
  .row code { color: var(--accent); font-size: 11px; }
  .muted { color: var(--muted); font-size: 12px; line-height: 1.6; }
  .hint { color: var(--muted); font-size: 11px; line-height: 1.6; margin-top: 8px; }

  .plan-list { display: flex; flex-direction: column; gap: 8px; }
  .plan-item {
    border: 1px solid var(--border); background: var(--panel-2);
    border-radius: 10px; padding: 9px 10px; font-size: 12px;
  }
  .plan-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .plan-title { color: var(--text); line-height: 1.4; }
  .plan-meta { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .status {
    flex: 0 0 auto; font-size: 10px; padding: 2px 7px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted);
  }
  .status.running { color: var(--warn); border-color: rgba(251, 191, 36, 0.45); }
  .status.done { color: var(--ok); border-color: rgba(52, 211, 153, 0.45); }
  .status.error { color: var(--danger); border-color: rgba(248, 113, 113, 0.45); }

  .quick { display: flex; flex-wrap: wrap; gap: 8px; }
  .quick button, .ghost-btn {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    padding: 7px 10px; border-radius: 9px; cursor: pointer; font-size: 12px;
    transition: border-color 0.15s, transform 0.15s;
  }
  .quick button:hover, .ghost-btn:hover { border-color: var(--accent-2); transform: translateY(-1px); }
  .ghost-btn { width: 100%; margin-top: 8px; }
  .token-actions { display: flex; gap: 6px; }
  .token-actions button { padding: 7px 9px; font-size: 12px; }

  @media (max-width: 980px) {
    main { grid-template-columns: 1fr; }
    .side-panel { max-height: 38vh; }
    .token-area input { width: 150px; }
  }
  @media (max-width: 640px) {
    header { align-items: flex-start; flex-direction: column; }
    .token-area { justify-content: flex-start; }
    .message { max-width: 96%; }
    .brand span { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">智能家政 <span>Agent Console · 5000</span></div>
    <div class="token-area">
      <span id="userLabel" class="user-label">未登录（demo 用户）</span>
      <input id="tokenInput" placeholder="粘贴小程序 token（可选）" autocomplete="off">
      <div class="token-actions">
        <button id="saveTokenBtn" class="ghost-btn">保存</button>
        <button id="clearTokenBtn" class="ghost-btn">清除</button>
      </div>
    </div>
  </header>

  <main>
    <section class="chat-panel">
      <div id="messages" class="messages"></div>
      <div class="composer">
        <textarea id="input" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
        <button id="sendBtn" class="send-btn">发送</button>
      </div>
    </section>

    <aside class="side-panel">
      <div class="card">
        <h3>运行信息</h3>
        <div class="row"><span>Agent</span><b id="agentField">-</b></div>
        <div class="row"><span>意图</span><b id="queryTypeField">-</b></div>
        <div class="row"><span>类型</span><b id="complexityField">-</b></div>
        <div class="row"><span>执行模式</span><b id="modeField">-</b></div>
        <div class="row"><span>会话</span><code id="sessionField">-</code></div>
      </div>

      <div class="card">
        <h3>计划步骤</h3>
        <div id="planList" class="plan-list">
          <div class="muted">简单问题不显示计划。</div>
        </div>
      </div>

      <div class="card">
        <h3>快捷问题</h3>
        <div class="quick" id="quickList">
          <button>我有哪些优惠券</button>
          <button>我的订单到哪一步了</button>
          <button>退款规则是什么</button>
          <button>阿姨迟到，订单能取消吗？退款多久到账？</button>
          <button>日常保洁多少钱</button>
          <button>阿姨什么时候有空</button>
          <button>帮我写一首诗</button>
          <button>我叫什么名字？</button>
        </div>
        <div class="hint">
          token 从微信开发者工具 → Storage 里复制；不填则使用 demo 用户，
          能看流式、路由、工具和复杂路径，但没有长期画像。
        </div>
      </div>

      <div class="card">
        <h3>会话控制</h3>
        <button id="newSessionBtn" class="ghost-btn">清空并新建会话</button>
      </div>
    </aside>
  </main>
</div>

<script>
(() => {
  const SESSION_KEY = "agent_console_session_id";
  const TOKEN_KEY = "agent_console_token";

  const $ = (id) => document.getElementById(id);
  const messagesEl = $("messages");
  const inputEl = $("input");
  const sendBtn = $("sendBtn");
  const tokenInput = $("tokenInput");
  const userLabel = $("userLabel");
  const planListEl = $("planList");

  let sessionId = localStorage.getItem(SESSION_KEY) || newId();
  let token = localStorage.getItem(TOKEN_KEY) || "";
  let sending = false;
  let answerEl = null;
  let receivedToken = false;
  let finished = false;

  function newId() {
    if (crypto && crypto.randomUUID) return crypto.randomUUID();
    return "s_" + Date.now() + "_" + Math.random().toString(16).slice(2);
  }

  function setSession(id) {
    sessionId = id;
    localStorage.setItem(SESSION_KEY, id);
    $("sessionField").textContent = id.length > 18 ? id.slice(0, 8) + "…" : id;
    $("sessionField").title = id;
  }

  function setField(id, value) {
    $(id).textContent = value || "-";
  }

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function appendMessage(role, text) {
    const row = document.createElement("div");
    row.className = "message " + role;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "你" : "AI";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollBottom();
    return bubble;
  }

  function appendAssistantPlaceholder() {
    const bubble = appendMessage("ai", "思考中…");
    bubble.classList.add("streaming");
    return bubble;
  }

  function appendAnswer(text) {
    if (!answerEl || !text) return;
    if (answerEl.textContent === "思考中…") answerEl.textContent = "";
    answerEl.textContent += text;
    scrollBottom();
  }

  function finishAnswer(content) {
    if (finished) return;
    finished = true;
    if (answerEl) {
      if (content) {
        answerEl.textContent = content;
      } else if (!receivedToken) {
        answerEl.textContent = "（没有返回内容）";
      }
      answerEl.classList.remove("streaming");
    }
    scrollBottom();
  }

  function resetSide() {
    setField("agentField", "处理中…");
    setField("queryTypeField", "-");
    setField("complexityField", "-");
    setField("modeField", "-");
    planListEl.textContent = "";
    const muted = document.createElement("div");
    muted.className = "muted";
    muted.textContent = "等待计划…";
    planListEl.appendChild(muted);
  }

  function planStatusClass(status) {
    if (status === "running") return "running";
    if (status === "done") return "done";
    if (status === "error") return "error";
    return "pending";
  }

  function renderPlan(steps) {
    planListEl.textContent = "";
    if (!steps || !steps.length) {
      const muted = document.createElement("div");
      muted.className = "muted";
      muted.textContent = "简单问题不显示计划。";
      planListEl.appendChild(muted);
      return;
    }
    steps.forEach((step) => {
      const item = document.createElement("div");
      item.className = "plan-item";
      item.dataset.stepId = String(step.step_id || "");

      const head = document.createElement("div");
      head.className = "plan-head";

      const title = document.createElement("div");
      title.className = "plan-title";
      title.textContent = `${step.step_id || ""}. ${step.title || "步骤"}`;

      const status = document.createElement("span");
      const state = step.status || "pending";
      status.className = "status " + planStatusClass(state);
      status.textContent = state;

      head.appendChild(title);
      head.appendChild(status);
      item.appendChild(head);
      planListEl.appendChild(item);
    });
  }

  function updatePlanStep(payload) {
    let item = planListEl.querySelector(`[data-step-id="${payload.step_id}"]`);
    if (!item) {
      renderPlan([payload]);
      item = planListEl.querySelector(`[data-step-id="${payload.step_id}"]`);
    }
    if (!item) return;

    const status = item.querySelector(".status");
    if (status) {
      const state = payload.stage === "start" ? "running" : (payload.status || "done");
      status.className = "status " + planStatusClass(state);
      status.textContent = state;
    }

    let meta = item.querySelector(".plan-meta");
    if (!meta) {
      meta = document.createElement("div");
      meta.className = "plan-meta";
      item.appendChild(meta);
    }
    const parts = [];
    if (payload.agent) parts.push(payload.agent);
    if (payload.tool) parts.push(payload.tool);
    meta.textContent = parts.join(" · ");
  }

  function handleEvent(payload) {
    if (!payload || typeof payload !== "object") return;

    if (payload.session_id) {
      setSession(payload.session_id);
    }

    if (payload.type === "token") {
      receivedToken = true;
      appendAnswer(payload.content || "");
      return;
    }

    if (payload.type === "plan") {
      renderPlan(payload.steps || []);
      return;
    }

    if (payload.type === "step") {
      updatePlanStep(payload);
      return;
    }

    if (payload.done) {
      setField("agentField", payload.agent);
      setField("queryTypeField", payload.query_type);
      setField("complexityField", payload.complexity);
      setField("modeField", payload.execution_mode);
      if (Array.isArray(payload.plan_steps) && payload.plan_steps.length) {
        renderPlan(payload.plan_steps);
      } else {
        renderPlan([]);
      }
      finishAnswer(payload.content || "");
      return;
    }

    if (payload.error) {
      if (answerEl) {
        answerEl.classList.remove("streaming");
        answerEl.classList.add("error");
        answerEl.textContent = "请求失败：" + payload.error;
      }
      finished = true;
    }
  }

  function handleSseBlock(block) {
    const dataLines = block
      .split(/\r?\n/)
      .filter((line) => line.startsWith("data:"))
      .map((line) => line.slice(5).trim());

    if (!dataLines.length) return;
    const data = dataLines.join("\n");
    if (data === "[DONE]") return;

    try {
      handleEvent(JSON.parse(data));
    } catch (err) {
      console.warn("无法解析 SSE 事件", data, err);
    }
  }

  async function sendMessage(textOverride) {
    const text = (textOverride !== undefined ? textOverride : inputEl.value).trim();
    if (!text || sending) return;

    appendMessage("user", text);
    inputEl.value = "";
    inputEl.style.height = "54px";
    sending = true;
    sendBtn.disabled = true;
    finished = false;
    receivedToken = false;
    resetSide();

    answerEl = appendAssistantPlaceholder();

    const headers = { "Content-Type": "application/json" };
    if (token) headers.token = token;

    try {
      const response = await fetch("/api/chat/stream", {
        method: "POST",
        headers,
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(errorText || `HTTP ${response.status}`);
      }
      if (!response.body) {
        throw new Error("当前浏览器不支持流式读取");
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const blocks = buffer.split(/\r?\n\r?\n/);
        buffer = blocks.pop() || "";
        blocks.forEach(handleSseBlock);
      }

      if (buffer.trim()) handleSseBlock(buffer);
      finishAnswer("");
    } catch (err) {
      if (answerEl) {
        answerEl.classList.remove("streaming");
        answerEl.classList.add("error");
        answerEl.textContent = "请求失败：" + (err.message || err);
      }
      finished = true;
    } finally {
      sending = false;
      sendBtn.disabled = false;
      if (answerEl) answerEl.classList.remove("streaming");
    }
  }

  async function refreshProfile() {
    token = tokenInput.value.trim();
    if (!token) {
      localStorage.removeItem(TOKEN_KEY);
      userLabel.textContent = "未登录（demo 用户）";
      return;
    }

    localStorage.setItem(TOKEN_KEY, token);
    userLabel.textContent = "正在读取用户…";
    try {
      const response = await fetch("/api/profile", { headers: { token } });
      if (!response.ok) {
        userLabel.textContent = "token 无效或已过期";
        return;
      }
      const data = await response.json();
      const profile = data.profile || {};
      userLabel.textContent = profile.preferred_name
        ? `已登录：${profile.preferred_name}`
        : "已登录";
    } catch (err) {
      userLabel.textContent = "读取用户失败";
    }
  }

  function clearToken() {
    token = "";
    tokenInput.value = "";
    localStorage.removeItem(TOKEN_KEY);
    userLabel.textContent = "未登录（demo 用户）";
  }

  function newSession() {
    setSession(newId());
    messagesEl.textContent = "";
    setField("agentField", "-");
    setField("queryTypeField", "-");
    setField("complexityField", "-");
    setField("modeField", "-");
    renderPlan([]);
    appendMessage(
      "ai",
      "新会话已创建。可以测试流式回答、Agent 路由、工具调用、复杂路径和长期记忆。"
    );
    inputEl.focus();
  }

  function init() {
    setSession(sessionId);
    tokenInput.value = token;
    if (token) refreshProfile();

    appendMessage(
      "ai",
      "控制台已就绪。\n\n" +
      "可以问：我有哪些优惠券、我的订单到哪一步了、退款规则是什么、" +
      "阿姨迟到订单能取消吗、日常保洁多少钱。\n\n" +
      "需要长期画像时，把小程序 token 粘贴到右上角并保存。"
    );

    $("saveTokenBtn").addEventListener("click", refreshProfile);
    $("clearTokenBtn").addEventListener("click", clearToken);
    $("newSessionBtn").addEventListener("click", newSession);
    sendBtn.addEventListener("click", () => sendMessage());

    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    inputEl.addEventListener("input", () => {
      inputEl.style.height = "54px";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
    });

    document.querySelectorAll("#quickList button").forEach((button) => {
      button.addEventListener("click", () => sendMessage(button.textContent));
    });

    inputEl.focus();
    scrollBottom();
  }

  init();
})();
</script>
</body>
</html>
