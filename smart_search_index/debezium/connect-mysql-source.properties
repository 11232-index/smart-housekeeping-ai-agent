# Debezium MySQL source
# 需要先在 MySQL 建好 debezium 账号，并开启 binlog（ROW + FULL）

name=smart-housekeeping-connector
connector.class=io.debezium.connector.mysql.MySqlConnector
tasks.max=1

database.hostname=127.0.0.1
database.port=3306
database.user=debezium
database.password=your_debezium_password
database.server.id=184054
database.include.list=smart_housekeeping_system
database.ssl.mode=disabled

# Windows 中文系统的 MySQL 时区表可能不完整，显式指定连接时区
database.connectionTimeZone=Asia/Shanghai

# 只监听会影响搜索索引的表
table.include.list=smart_housekeeping_system.service_item,smart_housekeeping_system.service_package,smart_housekeeping_system.category,smart_housekeeping_system.housekeeper,smart_housekeeping_system.employee,smart_housekeeping_system.employee_detail

# topic 前缀：<topic.prefix>.<database>.<table>
# 必须和 smart_search_index/config.py 的 DEBEZIUM_TOPIC_PREFIX 一致
topic.prefix=housekeeping

# Debezium 自己记录的 schema 变更历史
schema.history.internal.kafka.bootstrap.servers=127.0.0.1:9092
schema.history.internal.kafka.topic=schema-changes.smart_housekeeping

include.schema.changes=false
snapshot.mode=initial

# Decimal 统一按字符串传给消费者，避免精度问题
decimal.handling.mode=string
