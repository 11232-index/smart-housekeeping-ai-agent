# Kafka Connect standalone（Windows）
# 启动：bin\windows\connect-standalone.bat config\connect-standalone.properties config\connect-mysql-source.properties

bootstrap.servers=127.0.0.1:9092

key.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false

offset.storage.file.filename=C:/kafka-connect/data/connect.offsets
offset.flush.interval.ms=10000

plugin.path=C:/debezium/plugin
rest.port=8083
